name: Build MidiBard2 API12 (Dalamud Ready)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'v3-api12-stable'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore
      
      - name: Fake Dalamud install (CI workaround)
        shell: pwsh
        run: |
          $path = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $path

      - name: Build (Release)
        run: dotnet build MidiBard2.sln -c Release --no-restore

      # === 關鍵步驟：整理 Dalamud plugin 結構 ===
      - name: Prepare Dalamud plugin folder
        shell: pwsh
        run: |
          $out = "output/MidiBard2"
          New-Item -ItemType Directory -Force -Path $out

          # 主 DLL（名稱依實際專案，必要時可調）
          Copy-Item **/bin/Release/**/*.dll $out -Recurse -Force
          Copy-Item **/bin/Release/**/*.json $out -Recurse -Force

      - name: Upload Dalamud-ready plugin
        uses: actions/upload-artifact@v4
        with:
          name: MidiBard2-API12-Dalamud
          path: output/
